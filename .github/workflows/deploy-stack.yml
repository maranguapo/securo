name: Deploy stack

# Records an image version in the infrastructure repository's stack file. That
# repository already redeploys whenever the file changes (its workflow -> n8n ->
# Portainer webhook), so this is all it takes to roll a version out.
#
# Called by release.yml after a release is built, and runnable by hand:
#   - to roll back or forward to any published version, and
#   - with dry_run, to prove the key, the checkout and the edit work without
#     writing anything (git push --dry-run still checks the write permission).
# See docs/deploy-pipeline.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy, with or without the leading v (e.g. 0.17.0)"
        required: true
        type: string
      dry_run:
        description: "Check everything but do not push"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
    secrets:
      HOME_SERVICES_DEPLOY_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-stack
      cancel-in-progress: false
    env:
      STACK_REPO: ${{ vars.STACK_REPO || 'maranguapo/mrg-home-services' }}
      STACK_FILE: ${{ vars.STACK_FILE || 'docker-stacks/securo/stack.yaml' }}
      OWNER: ${{ github.repository_owner }}
      INPUT_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check the deploy key
        id: gate
        env:
          HOME_SERVICES_DEPLOY_KEY: ${{ secrets.HOME_SERVICES_DEPLOY_KEY }}
        run: |
          # The images are already published when a release calls this. Without
          # a key the release is still good; only the automatic rollout is skipped.
          if [ -z "$HOME_SERVICES_DEPLOY_KEY" ]; then
            echo "::notice::HOME_SERVICES_DEPLOY_KEY is not set; nothing was deployed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the stack repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.STACK_REPO }}
          # A deploy key (write access to that one repository) rather than the
          # default GITHUB_TOKEN: a push made with the GITHUB_TOKEN does not
          # trigger other workflows, so the stack repository's own workflow
          # would never run.
          ssh-key: ${{ secrets.HOME_SERVICES_DEPLOY_KEY }}
          path: stack

      - name: Point the stack at the images
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$INPUT_VERSION' is not a version"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          FILE="stack/$STACK_FILE"
          test -f "$FILE" || { echo "::error::$STACK_FILE not found in $STACK_REPO"; exit 1; }

          # Only the two image references change; everything else in the file
          # (including how they are wrapped in ${VAR:-...}) is left alone.
          sed -i -E "s#ghcr\.io/[A-Za-z0-9_.-]+/securo-(backend|frontend):[0-9A-Za-z._-]+#ghcr.io/${OWNER}/securo-\1:${VERSION}#g" "$FILE"

          # Fail loudly rather than commit a file that never took the version.
          for part in backend frontend; do
            grep -q "ghcr.io/${OWNER}/securo-${part}:${VERSION}" "$FILE" || {
              echo "::error::no securo-${part} image reference found in $STACK_FILE"; exit 1; }
          done

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        working-directory: stack
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ env.VERSION }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::notice::$STACK_FILE already points at $VERSION; nothing to do."
            exit 0
          fi
          git --no-pager diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(securo): v${VERSION}" -m "Release: ${RELEASE_URL}"

          if [ "$DRY_RUN" = "true" ]; then
            # Still authenticates against the remote, so a missing or read-only
            # key fails here instead of on a real release.
            git push --dry-run
            echo "::notice::Dry run: the edit and the push permission check out; nothing was pushed."
            exit 0
          fi

          # Another stack may have been pushed meanwhile: rebase, then push.
          for _ in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep 3
          done
          echo "::error::could not push to $STACK_REPO"; exit 1
