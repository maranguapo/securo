name: Build and Push Docker Images

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-helm:
    needs: [build-backend, build-frontend]
    # Publishing the Helm chart (and its Artifact Hub metadata) is opt-in: set
    # the repository variable PUBLISH_HELM_CHART=true. Left off, a failure here
    # cannot mark an otherwise good release as failed.
    if: ${{ vars.PUBLISH_HELM_CHART == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Helm Chart
        run: |
          # Strip the 'v' prefix from the release tag if it exists, as helm chart version needs to be semver without v.
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          echo "Injecting version $VERSION into artifacthub.io/images annotation"
          sed -i "s|ghcr.io/securo-finance/securo-backend:latest|ghcr.io/securo-finance/securo-backend:${VERSION}|g" charts/securo/Chart.yaml
          sed -i "s|ghcr.io/securo-finance/securo-frontend:latest|ghcr.io/securo-finance/securo-frontend:${VERSION}|g" charts/securo/Chart.yaml

          echo "Injecting version $VERSION into values.yaml"
          sed -i "s|tag: latest|tag: ${VERSION}|g" charts/securo/values.yaml

          echo "Packaging chart version $VERSION"
          helm package charts/securo --version "$VERSION" --app-version "$VERSION"

          helm push securo-$VERSION.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Push Artifact Hub Metadata
        run: |
          # Artifact Hub reads this from the chart's own path, not the parent
          # namespace: `helm push ... /charts` publishes to /charts/securo, so
          # the metadata has to carry the same prefix or it is never found.
          oras push ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/securo:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/securo/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # Hands the new version to the infrastructure repository. That repository
  # already redeploys whenever its stack file changes (workflow -> n8n ->
  # Portainer webhook), so recording the new tag there is all it takes to roll
  # the release out. See docs/deploy-pipeline.md.
  deploy:
    needs: [build-backend, build-frontend]
    # A pre-release is published for testing, not for production.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-stack
      cancel-in-progress: false
    env:
      STACK_REPO: ${{ vars.STACK_REPO || 'maranguapo/mrg-home-services' }}
      STACK_FILE: ${{ vars.STACK_FILE || 'docker-stacks/securo/stack.yaml' }}
      TAG_NAME: ${{ github.event.release.tag_name }}
      RELEASE_URL: ${{ github.event.release.html_url }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Check the deploy token
        id: gate
        env:
          HOME_SERVICES_TOKEN: ${{ secrets.HOME_SERVICES_TOKEN }}
        run: |
          # The images are already published at this point. Without a token the
          # release is still good; only the automatic rollout is skipped.
          if [ -z "$HOME_SERVICES_TOKEN" ]; then
            echo "::notice::HOME_SERVICES_TOKEN is not set; images were published but nothing was deployed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the stack repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.STACK_REPO }}
          # A push made with the default GITHUB_TOKEN does not trigger other
          # workflows, so the stack repository's own workflow would never run.
          token: ${{ secrets.HOME_SERVICES_TOKEN }}
          path: stack

      - name: Point the stack at the new images
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG_NAME' is not a version tag"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          FILE="stack/$STACK_FILE"
          test -f "$FILE" || { echo "::error::$STACK_FILE not found in $STACK_REPO"; exit 1; }

          # Only the two image references change; everything else in the file
          # (including how they are wrapped in ${VAR:-...}) is left alone.
          sed -i -E "s#ghcr\.io/[A-Za-z0-9_.-]+/securo-(backend|frontend):[0-9A-Za-z._-]+#ghcr.io/${OWNER}/securo-\1:${VERSION}#g" "$FILE"

          # Fail loudly rather than commit a file that never took the version.
          for part in backend frontend; do
            grep -q "ghcr.io/${OWNER}/securo-${part}:${VERSION}" "$FILE" || {
              echo "::error::no securo-${part} image reference found in $STACK_FILE"; exit 1; }
          done

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        working-directory: stack
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::notice::$STACK_FILE already points at $VERSION; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(securo): v${VERSION}" -m "Release: ${RELEASE_URL}"
          # Another stack may have been pushed meanwhile: rebase, then push.
          for _ in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep 3
          done
          echo "::error::could not push to $STACK_REPO"; exit 1

